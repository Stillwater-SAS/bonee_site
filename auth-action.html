<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Validation du compte — Bonee</title>
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="./"><img src="img/logo.png" alt="" width="34" height="34">Bonee</a>
    </div>
  </header>

  <main class="legal" id="action" aria-live="polite">
    <h1 id="titre">Un instant…</h1>
    <p id="message">Nous traitons ta demande.</p>

    <form id="formulaire" class="action-form" hidden>
      <label for="mdp">Nouveau mot de passe</label>
      <input id="mdp" type="password" autocomplete="new-password" minlength="8" required>
      <label for="mdp2">Confirme le mot de passe</label>
      <input id="mdp2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn" type="submit">Enregistrer</button>
    </form>

    <p id="suite" hidden>Tu peux retourner dans l'application Bonee.</p>
  </main>

  <script src="auth-action-config.js"></script>
  <script src="auth-action.js"></script>
</body>
</html>
